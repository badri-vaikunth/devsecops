name: terraform-workflow
on: push
jobs:
  terraform:
    runs-on: ubuntu-22.04
    steps:
      - name: code checkout
        uses: actions/checkout@v4 
        with:
         ref: testing
      - name: Checking the Git Branch
        run: git status
      - name: version check
        run: terraform -version
      - name: init
        run: terraform init
      - name: plan 
        run: terraform plan
      - name: apply
        run: terraform apply
